[package]
name = "zevl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.8", features = ["derive"] }
cliclack = "0.5.7"
clor = "0.0.2"
crossterm = "0.29"
keyring = "4.2.0"
nucleo-matcher = "0.3"
open = "5.4.5"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tui-input = "0.15"
unicode-segmentation = "1"
unicode-width = "0.2"
ureq = { version = "3.5.2", features = ["json"] }
